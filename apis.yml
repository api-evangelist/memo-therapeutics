aid: memo-therapeutics
name: Memo Therapeutics
description: >-
  Memo Therapeutics AG ("MTx"), an Ipsen company, is a late-stage biotechnology company headquartered at
  Wagistrasse 27 in Schlieren / Zurich, Switzerland, with a US office as Memo Therapeutics US, Inc. in
  Wilson, North Carolina. It develops best-in-class therapeutic antibodies to transform the lives of
  patients with viral infections and cancer, built on DROPZYLLA, a microfluidic single-cell platform that
  makes a recombinant in vitro copy of an individual donor's B-cell antibody repertoire, banks it as a
  library, and screens it functionally at high throughput. Its lead program, potravitug, is a first-in-class
  monoclonal antibody against BK polyomavirus (BKPyV) reactivation in kidney transplant recipients; the
  Phase II SAFE KIDNEY II trial reported biopsy-proven resolution of BKPyV-associated nephropathy with
  sustained viral-load reduction to week 38, and the asset holds EU orphan designation. In February 2026 the
  company entered a collaboration and option agreement with CSL for its recombinant polyclonal IgG
  technology carrying milestones of up to CHF 265 million, and it has run an oncology antibody-discovery
  collaboration with Ono Pharmaceutical since 2022 alongside nephrology collaborations with the University
  Hospital of Zurich and the University Hospital of Bern. Ipsen completed its acquisition of Memo
  Therapeutics AG on 22 July 2026, adding potravitug to Ipsen's rare-disease pipeline. Memo Therapeutics
  runs no developer program and publishes no product API, developer portal, SDK or API documentation. The
  only machine-readable surface reachable without credentials is the WordPress REST content API behind
  memo-therapeutics.com, catalogued here, together with an llms.txt the site's SEO plugin publishes.
