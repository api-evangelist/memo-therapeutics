- id: cookie-nonce
  type: cookie
  description: >-
    WordPress core's first-party scheme — a logged-in session cookie plus an X-WP-Nonce header.
    Advertised by the deployment: the response to an anonymous call carries
    "access-control-allow-headers: Authorization, X-WP-Nonce, ...". Not obtainable by an outside
    integrator; it exists for the site's own editor UI.
  applies_to: write
  status: gated
- id: authorization-header
  type: http
  description: >-
    An Authorization header is accepted by the origin (wp-site-health/v1/tests/authorization-header
    is registered), which is how WordPress Application Passwords would be presented. No credential
    is issued to third parties, so this is a capability of the software, not an access model
    Memo Therapeutics operates.
  applies_to: write
  status: gated
