source: >-
  Live anonymous probes of https://memo-therapeutics.com/wp-json on 2026-08-25, plus the route
  index the site publishes at /wp-json/. Memo Therapeutics publishes no authentication
  documentation of its own; the upstream contract is defined at
  https://developer.wordpress.org/rest-api/using-the-rest-api/authentication/
docs: https://developer.wordpress.org/rest-api/using-the-rest-api/authentication/
summary: >-
  The published read surface requires no credentials at all. Every write operation and every
  administrative namespace is closed to anonymous clients and answers 401 with the WordPress REST
  error envelope. There is no API key programme, no OAuth server, no token endpoint and no
  developer sign-up — Memo Therapeutics does not issue credentials for this surface to anyone
  outside the company.
schemes:
